name: PSD CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  psd-ci:
    uses: PSD401/.github/.github/workflows/reusable-psd-ci.yml@1aa5f5351a78b15f5c71668037f5d35b9613ae41 # v1.0.0
    with:
      # Same checks as ci.yml browser-and-contracts, minus Playwright
      # (test:extension), browser packaging and the network-dependent bun audit.
      # test (vitest) and build run via the reusable's auto defaults.
      lint-command: 'bun run format:check && bun run openwiki:check && bun run lint && bun run licenses:check'
      typecheck-command: 'bun run typecheck && bun run contracts:check && bun run messages:check'
