name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm contracts:check
      - run: pnpm messages:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @atrium-capture/browser-extension exec playwright install --with-deps chromium
      - run: pnpm test:extension
      - run: pnpm package:browser
      - run: pnpm licenses:check
      - run: pnpm security:audit

  swift-contracts:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path apps/macos
      - run: scripts/build-macos-app.sh

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check dependency review availability
        id: dependency-review-availability
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          response="$RUNNER_TEMP/dependency-review-availability.json"
          status="$(
            curl --silent --show-error \
              --output "$response" \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dependency-graph/compare/$BASE_SHA...$HEAD_SHA"
          )"

          if [ "$status" = "200" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "403" ] && [ "$REPOSITORY_PRIVATE" = "true" ]; then
            echo "::notice::Dependency review requires GitHub Advanced Security for this private repository; pnpm audit and the license allowlist remain required."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected dependency review API response: HTTP $status" >&2
            sed -n '1,40p' "$response" >&2
            exit 1
          fi
      - uses: actions/dependency-review-action@v4
        if: steps.dependency-review-availability.outputs.available == 'true'
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0, BlueOak-1.0.0, MPL-2.0, Zlib
          allow-dependencies: pkg:npm/winreg@0.0.12
