name: CI

# pull_request only: checks don't re-run after the merge (psd-dev-standards
# standards/06 §4, Runner minutes).
#
# Skipped when every changed file is Markdown or the OpenWiki bot's metadata
# file, so docs don't spend macOS minutes on swift-contracts. Any other file
# runs it. None of these jobs is a required check; psd-ci / psd-ci (psd-ci.yml)
# still runs on docs PRs, including format:check and openwiki:check, the only
# checks here that read .md files. If a job here ever becomes a required check,
# replace paths-ignore with a skip inside the job: a workflow skipped this way
# reports no status, so a required check would wait forever.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - openwiki/.last-update.json

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run openwiki:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run contracts:check
      - run: bun run messages:check
      - run: bun run test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:extension
      - run: bun run package:browser
      - run: bun run licenses:check
      - run: bun run security:audit

  swift-contracts:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test --package-path apps/macos
      - run: scripts/build-macos-app.sh

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check dependency review availability
        id: dependency-review-availability
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          response="$RUNNER_TEMP/dependency-review-availability.json"
          status="$(
            curl --silent --show-error \
              --output "$response" \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dependency-graph/compare/$BASE_SHA...$HEAD_SHA"
          )"

          if [ "$status" = "200" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "403" ] && [ "$REPOSITORY_PRIVATE" = "true" ]; then
            echo "::notice::Dependency review requires GitHub Advanced Security for this private repository; bun audit and the license allowlist remain required."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected dependency review API response: HTTP $status" >&2
            sed -n '1,40p' "$response" >&2
            exit 1
          fi
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: steps.dependency-review-availability.outputs.available == 'true'
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0, BlueOak-1.0.0, MPL-2.0, Zlib
          allow-dependencies: pkg:npm/winreg@0.0.12
