name: Release macOS installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Three-part release version already committed to main
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Resolve and verify release ref
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          git fetch origin main --tags
          tag_exists=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$REQUESTED_VERSION"
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Version must use major.minor.patch." >&2
              exit 1
            fi
            release_tag="v$version"
            if git show-ref --verify --quiet "refs/tags/$release_tag"; then
              if [ "$(git rev-list -n 1 "$release_tag")" != "$GITHUB_SHA" ]; then
                echo "Tag $release_tag already points at a different commit." >&2
                exit 1
              fi
              tag_exists=true
            fi
          else
            release_tag="$GITHUB_REF_NAME"
            tag_exists=true
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "ATRIUM_RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "ATRIUM_RELEASE_TAG_EXISTS=$tag_exists" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run engineering gates
        run: |
          pnpm check
          pnpm security:audit

      - name: Import Developer ID certificates
        env:
          APPLICATION_P12: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12 }}
          APPLICATION_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          INSTALLER_P12: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER_P12 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_BUILD_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLICATION_P12" ] || [ -z "$APPLICATION_P12_PASSWORD" ] ||
             [ -z "$INSTALLER_P12" ] || [ -z "$INSTALLER_P12_PASSWORD" ] ||
             [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "Developer ID release secrets are incomplete." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/atrium-release.keychain-db"
          printf '%s' "$APPLICATION_P12" | base64 --decode > "$RUNNER_TEMP/application.p12"
          printf '%s' "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/application.p12" \
            -k "$keychain" -P "$APPLICATION_P12_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" \
            -k "$keychain" -P "$INSTALLER_P12_PASSWORD" -T /usr/bin/productbuild
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          echo "ATRIUM_RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and verify installer
        env:
          NOTARY_PRIVATE_KEY: ${{ secrets.MACOS_NOTARY_PRIVATE_KEY }}
          ATRIUM_CAPTURE_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          ATRIUM_CAPTURE_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          if [ -z "$NOTARY_PRIVATE_KEY" ] || [ -z "$ATRIUM_CAPTURE_NOTARY_KEY_ID" ] ||
             [ -z "$ATRIUM_CAPTURE_NOTARY_ISSUER_ID" ]; then
            echo "Apple notarization secrets are incomplete." >&2
            exit 1
          fi
          printf '%s' "$NOTARY_PRIVATE_KEY" > "$RUNNER_TEMP/notary-key.p8"
          chmod 600 "$RUNNER_TEMP/notary-key.p8"
          app_identity="$(
            security find-identity -v -p codesigning "$ATRIUM_RELEASE_KEYCHAIN" |
              sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' |
              head -n 1
          )"
          installer_identity="$(
            security find-identity -v -p basic "$ATRIUM_RELEASE_KEYCHAIN" |
              sed -n 's/.*"\(Developer ID Installer:.*\)"/\1/p' |
              head -n 1
          )"
          if [ -z "$app_identity" ] || [ -z "$installer_identity" ]; then
            echo "Imported certificates do not contain both Developer ID identities." >&2
            exit 1
          fi
          ATRIUM_CAPTURE_CODESIGN_IDENTITY="$app_identity" \
          ATRIUM_CAPTURE_INSTALLER_IDENTITY="$installer_identity" \
          ATRIUM_CAPTURE_NOTARY_KEY_PATH="$RUNNER_TEMP/notary-key.p8" \
          ATRIUM_CAPTURE_EXPECTED_TAG="$ATRIUM_RELEASE_TAG" \
          ATRIUM_CAPTURE_REQUIRE_DISTRIBUTION=1 \
            scripts/build-macos-pkg.sh

      - name: Create release tag after verification
        if: >-
          github.event_name == 'workflow_dispatch' &&
          env.ATRIUM_RELEASE_TAG_EXISTS != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$ATRIUM_RELEASE_TAG" "$GITHUB_SHA" \
            -m "Atrium Capture ${ATRIUM_RELEASE_TAG#v}"
          git push origin "$ATRIUM_RELEASE_TAG"

      - name: Stage and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${ATRIUM_RELEASE_TAG#v}"
          artifact="dist/macos/Atrium-Capture-$version.pkg"
          if gh release view "$ATRIUM_RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$ATRIUM_RELEASE_TAG" \
              "$artifact#Atrium Capture $version macOS installer" \
              "$artifact.sha256#SHA-256 checksum" \
              "dist/macos/macos-package-manifest.json#Verified distribution manifest" \
              --clobber
          else
            gh release create "$ATRIUM_RELEASE_TAG" \
              "$artifact#Atrium Capture $version macOS installer" \
              "$artifact.sha256#SHA-256 checksum" \
              "dist/macos/macos-package-manifest.json#Verified distribution manifest" \
              --verify-tag \
              --generate-notes \
              --title "Atrium Capture $version" \
              --draft
          fi
          gh release edit "$ATRIUM_RELEASE_TAG" --draft=false
