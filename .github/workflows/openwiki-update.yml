# OpenWiki Update workflow
# Runs the OpenWiki documentation agent (langchain-ai/openwiki) on every push to
# `main` (plus a weekly backstop) to keep the agent-navigable `openwiki/` wiki
# current, then opens or refreshes one rolling PR against `main`.
#
# LLM serving uses Bedrock's OpenAI-compatible endpoint with GLM-5 (zai.glm-5),
# matching the hardened psd401/aistudio and psd401/psd401-prr setup. No capture
# content is used: the workflow reads repository source and synthetic fixtures.
#
# Do not run `openwiki code --init` and accept its stock workflow. The scaffolder
# may replace this hardened file with an unpinned, third-party-provider template.
# The rolling PR is deliberately capped to `openwiki/`.
#
# One-time repository prerequisites:
#   1. Make the long-term `BEDROCK_API_KEY` organization/repository Actions secret
#      available to this repository.
#   2. Enable Actions -> General -> Workflow permissions ->
#      "Allow GitHub Actions to create and approve pull requests".
name: OpenWiki Update

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # 08:00 UTC is midnight PST. Monday is a backstop for skipped push runs.
    - cron: '0 8 * * 1'

concurrency:
  group: openwiki-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Regenerate OpenWiki
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check provider secret
        id: gate
        env:
          BEDROCK_KEY: ${{ secrets.BEDROCK_API_KEY }}
        run: |
          if [ -z "$BEDROCK_KEY" ]; then
            echo "BEDROCK_API_KEY not configured — skipping OpenWiki update."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          # OpenWiki reads the previous gitHead to calculate incremental changes.
          fetch-depth: 0
          # Do not expose a persisted repository token to the documentation agent.
          persist-credentials: false

      - name: Set up Node.js
        if: steps.gate.outputs.configured == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Install OpenWiki and formatter
        if: steps.gate.outputs.configured == 'true'
        # Review and deliberately bump these pins. OpenWiki 0.2.0 emits OKF
        # v0.1. Prettier matches the repository lockfile and keeps generated
        # front matter compatible with the required format check.
        run: npm install --global openwiki@0.2.0 prettier@3.9.6

      - name: Run OpenWiki
        if: steps.gate.outputs.configured == 'true'
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai-compatible
          OPENWIKI_MODEL_ID: zai.glm-5
          OPENAI_COMPATIBLE_BASE_URL: https://bedrock-runtime.us-west-2.amazonaws.com/openai/v1
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          OPENWIKI_TELEMETRY_DISABLED: '1'
          DO_NOT_TRACK: '1'

      - name: Normalize OpenWiki output
        if: steps.gate.outputs.configured == 'true'
        run: |
          node scripts/normalize-openwiki.mjs
          prettier --write openwiki

      - name: Create OpenWiki update pull request
        if: steps.gate.outputs.configured == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: main
          add-paths: openwiki
          branch: openwiki/update
          commit-message: 'docs: update OpenWiki'
          title: 'docs: update OpenWiki'
          body: |
            Automated OpenWiki documentation update.
            Generated by `.github/workflows/openwiki-update.yml`.

            The pull request is scoped to `openwiki/` only.
