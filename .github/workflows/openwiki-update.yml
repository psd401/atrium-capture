name: OpenWiki Update
on:
  workflow_dispatch:
  # No push trigger: since PSD401/.github v1.2.1 the reusable skips push runs
  # unless the caller passes run_on_push: true, so the Monday run rebuilds the wiki.
  schedule:
    - cron: '0 8 * * 1'
jobs:
  openwiki:
    permissions:
      contents: write # rolling docs PR + self-merge; caller must grant (org default is read-only)
      pull-requests: write
    uses: PSD401/.github/.github/workflows/reusable-openwiki.yml@c45b4f3a318261e6728a51545ca8ca5e242abb61 # v1.22.2
    with:
      base_branch: main
    secrets:
      BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
      PSD_AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.PSD_AUTOMATION_APP_PRIVATE_KEY }}
