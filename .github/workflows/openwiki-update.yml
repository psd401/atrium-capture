name: OpenWiki Update
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'
jobs:
  openwiki:
    permissions:
      contents: write # rolling docs PR + self-merge; caller must grant (org default is read-only)
      pull-requests: write
    uses: PSD401/.github/.github/workflows/reusable-openwiki.yml@main
    with:
      base_branch: main
    secrets:
      BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
      PSD_AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.PSD_AUTOMATION_APP_PRIVATE_KEY }}
